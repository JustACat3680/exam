on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Зависимости
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake gcc g++
        sudo apt-get install libgtest-dev libgmock-dev
    - name: Сборка
      run: | 
        cmake -B build
        cmake --build build